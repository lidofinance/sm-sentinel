[project]
name = "sentinel"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.0",
    "web3>=7.15.0",
    "python-telegram-bot[rate-limiter,job-queue]>=21.4",
    "python-dotenv>=1.2.2",
    "tqdm>=4.66.5",
    "async-lru>=2.0.5",
    "prometheus-client>=0.25.0",
    "pydantic>=2.12.5,<3",
    "sqlalchemy[asyncio]>=2.0.44,<3",
    "aiosqlite>=0.21,<1",
    "alembic>=1.17,<2",
]

[tool.uv]
cache-dir = ".uv-cache"
package = false

# Lets uv build metadata for the dynamic-version virtual project without
# tripping setuptools flat-layout discovery on sentinel/ and abi/.
[tool.setuptools]
py-modules = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.0",
    "ty>=0.0.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-m \"not integration\""
markers = [
    "integration: mark tests that require a local Anvil fork",
]
